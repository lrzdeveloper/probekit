name: Publish

# Publishes to npm with a signed provenance statement when a GitHub Release
# is published. Requires an NPM_TOKEN secret (an npm automation token).
# `id-token: write` lets npm attach build provenance (npm docs: publish --provenance).
# Prereleases go to the `next` dist-tag so they never become `latest`.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$v" ]; then
            echo "::error::Release tag $TAG does not match package.json version $v"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
