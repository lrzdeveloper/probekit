name: Publish

# Publishes to npm with a signed provenance statement when a GitHub Release
# is published. Requires an NPM_TOKEN secret (an npm automation token).
# `id-token: write` lets npm attach build provenance (npm docs: publish --provenance).

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
